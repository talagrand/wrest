name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  MSRV: '1.90'

jobs:
  discover-tools:
    name: Discover standalone Rust workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      workspaces: ${{ steps.find.outputs.workspaces }}
      has_workspaces: ${{ steps.find.outputs.has_workspaces }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Discover workspaces
      id: find
      shell: bash
      run: |
        set -euo pipefail
        workspaces_raw=$(
          find tools -type d -name target -prune -o -type f -name Cargo.toml -print |
            while IFS= read -r manifest; do
              if grep -qE '^\[workspace\][[:space:]]*$' "$manifest"; then
                dirname "$manifest"
              fi
            done | sort -u
        )
        if [ -z "$workspaces_raw" ]; then
          echo "No standalone Cargo workspaces discovered."
          {
            echo "workspaces=[]"
            echo "has_workspaces=false"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi
        mapfile -t workspaces <<< "$workspaces_raw"
        printf 'Discovered: %s\n' "${workspaces[@]}"
        json=$(printf '%s\n' "${workspaces[@]}" |
          jq -Rsc 'split("\n") | map(sub("\r$"; "") | select(length > 0) | {path: .})')
        {
          echo "workspaces=$json"
          echo "has_workspaces=true"
        } >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # -- Windows - native WinHTTP backend -----------------------
          - { name: 'win / msrv / no-defaults',   os: windows-latest, rust: msrv,   mode: no-defaults }
          - { name: 'win / msrv / defaults',       os: windows-latest, rust: msrv,   mode: defaults }
          - { name: 'win / stable / no-defaults',  os: windows-latest, rust: stable, mode: no-defaults }
          - { name: 'win / stable / all-native',   os: windows-latest, rust: stable, mode: all, doc-tests: true }
          # -- Windows - reqwest passthrough (via always-reqwest) -----
          - { name: 'win / stable / reqwest',      os: windows-latest, rust: stable, mode: all-reqwest }
          # -- Linux - reqwest passthrough (implicit, no always-reqwest needed)
          - { name: 'linux / msrv / no-defaults',  os: ubuntu-latest,  rust: msrv,   mode: no-defaults }
          - { name: 'linux / msrv / defaults',      os: ubuntu-latest,  rust: msrv,   mode: defaults }
          - { name: 'linux / stable / no-defaults', os: ubuntu-latest,  rust: stable, mode: no-defaults }
          - { name: 'linux / stable / all',         os: ubuntu-latest,  rust: stable, mode: all }
          # -- macOS - reqwest passthrough (same code as Linux; guards macOS-specific regressions)
          - { name: 'mac / stable / all',           os: macos-latest,   rust: stable, mode: all }

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Resolve matrix parameters
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        # Toolchain
        rust="${{ matrix.rust }}"
        [[ "$rust" == "msrv" ]] && rust="$MSRV"
        echo "toolchain=$rust" >> "$GITHUB_OUTPUT"

        # Cargo feature flags
        case "${{ matrix.mode }}" in
          no-defaults)  echo "flags=--no-default-features" ;;
          defaults)     echo "flags=" ;;
          all)          echo "flags=--features __all-native-features" ;;
          all-reqwest)  echo "flags=--features __all-native-features,always-reqwest" ;;
        esac >> "$GITHUB_OUTPUT"

        if [[ "${{ matrix.rust }}" == "stable" ]]; then
          echo "should-run-full-checks=true" >> "$GITHUB_OUTPUT"
        else
          echo "should-run-full-checks=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        toolchain: ${{ steps.resolve.outputs.toolchain }}
        components: ${{ steps.resolve.outputs.should-run-full-checks == 'true' && 'clippy' || '' }}

    - name: Start go-httpbin
      # Local tests just hit httpbin.org for simplicity, but that introduces a source
      # of flakiness. For CI, we run a local instance of the service for reliability.
      # Note some tests continue to hit live end-points that cannot be covered by httpbin
      # (namely SSL and proxy tests), but experimentally these are far more reliable.
      if: steps.resolve.outputs.should-run-full-checks == 'true'
      uses: ./.github/actions/start-httpbin

    - name: Start mTLS test server
      # tests/mtls.rs is behind cfg(native_winhttp), on for every Windows job.
      if: steps.resolve.outputs.should-run-full-checks == 'true' && runner.os == 'Windows'
      uses: ./.github/actions/start-mtls

    - name: Run clippy
      if: steps.resolve.outputs.should-run-full-checks == 'true'
      run: cargo clippy --all-targets ${{ steps.resolve.outputs.flags }} -- -D warnings

    - name: Run tests
      if: steps.resolve.outputs.should-run-full-checks == 'true'
      run: cargo test --all-targets ${{ steps.resolve.outputs.flags }} --verbose

    - name: Diagnose failure
      if: failure() && steps.resolve.outputs.should-run-full-checks == 'true'
      shell: bash
      run: |
        echo "::group::go-httpbin (http) log"
        cat httpbin-http.log || echo "(no httpbin-http.log found)"
        echo "::endgroup::"
        echo "::group::go-httpbin (https) log"
        cat httpbin-https.log || echo "(no httpbin-https.log found)"
        echo "::endgroup::"
        echo "::group::mtls-server log"
        cat mtls-server.log || echo "(no mtls-server.log found)"
        echo "::endgroup::"

    - name: Check library (MSRV)
      # MSRV verifies the library still compiles on the stated minimum
      # toolchain.  We use `cargo check` (not `cargo test`) so MSRV is
      # bound by the public API, not by dev-dependencies.
      if: steps.resolve.outputs.should-run-full-checks != 'true'
      run: cargo check ${{ steps.resolve.outputs.flags }} --verbose

    - name: Run doc tests
      if: matrix.doc-tests
      run: cargo test --doc --features __all-native-features

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        components: rustfmt

    - name: Check formatting
      run: cargo fmt --all -- --check

  standalone-tools:
    name: Standalone Rust / ${{ matrix.path }}
    needs: discover-tools
    if: needs.discover-tools.outputs.has_workspaces == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-tools.outputs.workspaces) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        toolchain: stable
        components: clippy,rustfmt

    - name: Check formatting
      working-directory: ${{ matrix.path }}
      run: cargo fmt --all -- --check

    - name: Run clippy
      working-directory: ${{ matrix.path }}
      run: cargo clippy --locked --all-targets -- -D warnings

    - name: Run tests
      working-directory: ${{ matrix.path }}
      run: cargo test --locked --all-targets

  docs:
    name: Documentation
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: '-D warnings'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

    - name: Build documentation
      run: cargo doc --features __all-native-features --no-deps

  coverage:
    name: Coverage
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # tokenless Codecov upload via OIDC

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        components: llvm-tools-preview

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
      with:
        tool: cargo-llvm-cov

    - name: Start go-httpbin
      uses: ./.github/actions/start-httpbin

    - name: Generate coverage
      run: cargo llvm-cov --features __all-native-features --lcov --output-path lcov.info

    - name: Diagnose failure
      if: failure()
      shell: bash
      run: |
        echo "::group::go-httpbin (http) log"
        cat httpbin-http.log || echo "(no httpbin-http.log found)"
        echo "::endgroup::"
        echo "::group::go-httpbin (https) log"
        cat httpbin-https.log || echo "(no httpbin-https.log found)"
        echo "::endgroup::"

    - name: Upload to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: lcov.info
        fail_ci_if_error: true
        use_oidc: true

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install cargo-audit
      uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
      with:
        tool: cargo-audit

    - name: Run security audit
      run: cargo audit

  minimal-versions:
    name: Minimal Versions (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: native,  os: windows-latest }
          - { name: reqwest, os: ubuntu-latest }

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Rust nightly
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        toolchain: nightly

    - name: Install cargo-hack and cargo-minimal-versions
      uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
      with:
        tool: cargo-hack,cargo-minimal-versions

    - name: Check minimal versions
      shell: bash
      run: cargo +nightly minimal-versions check --direct --features __all-native-features

  typos:
    name: Typos
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install typos
      uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
      with:
        tool: typos-cli

    - name: Run typos
      # Config lives in `_typos.toml` at the repo root.
      run: typos

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Run actionlint
      uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  ci-success:
    # Single required status check for branch protection.  Add new jobs to
    # `needs:` rather than re-listing each one in the branch protection rule.
    name: CI Success
    if: always()
    runs-on: ubuntu-latest
    needs: [discover-tools, test, fmt, standalone-tools, typos, workflow-lint, docs, coverage, security, minimal-versions]
    steps:
      - name: Verify all required jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required jobs failed or were cancelled."
          exit 1
