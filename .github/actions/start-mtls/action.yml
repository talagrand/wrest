name: 'Start mTLS test server'
description: >
  Installs Go from .github/ci-tools/go.mod, builds and starts mtls-server on
  127.0.0.1:18443 (client certificate optional) and 127.0.0.1:18444 (required),
  and waits for both, then exports WREST_MTLS=1 so the tests fail rather
  than skip if the server is missing.
  Logs mtls-server output to ./mtls-server.log so downstream "Diagnose failure"
  step can dump it.
  Note: server process is left running after the job; GH runners are
  automatically reaped.

runs:
  using: 'composite'
  steps:
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: '.github/ci-tools/go.mod'

    - name: Start mtls-server
      shell: bash
      run: |
        set -euo pipefail
        export GOBIN="$PWD/target/ci-tools"
        mkdir -p "$GOBIN"
        go install -C .github/ci-tools ./mtls-server
        "$GOBIN/mtls-server" > mtls-server.log 2>&1 &
        ok=0
        for _ in $(seq 1 60); do
          # 18444 refuses a certless handshake, so probe the socket rather
          # than the response.
          if curl -fsSk https://127.0.0.1:18443/client-cert > /dev/null 2>&1 \
            && (exec 3<>/dev/tcp/127.0.0.1/18444) 2>/dev/null; then
            ok=1
            break
          fi
          sleep 0.5
        done
        if [[ $ok -ne 1 ]]; then
          echo "::error::mtls-server failed to start within 30s"
          cat mtls-server.log || true
          exit 1
        fi
        echo "WREST_MTLS=1" >> "$GITHUB_ENV"
