name: 'Start go-httpbin'
description: >
  Starts local go-httpbin instances for the test suite via
  .github/ci-tools/start-httpbin.sh: HTTP on 127.0.0.1:8080 (HTTPBIN_HTTP_URL) and
  HTTPS on 127.0.0.1:8443 (HTTPBIN_HTTPS_URL, self-signed). Installs Go from
  .github/ci-tools/go.mod first. See that script for details; it also runs
  locally. Logs to ./httpbin-http.log and ./httpbin-https.log for the downstream
  "Diagnose failure" step; server processes are left running (runners are reaped).

runs:
  using: 'composite'
  steps:
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: '.github/ci-tools/go.mod'

    - name: Start go-httpbin
      shell: bash
      run: bash .github/ci-tools/start-httpbin.sh
