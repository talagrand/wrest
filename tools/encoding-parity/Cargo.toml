[package]
name = "encoding-parity"
edition = "2024"
rust-version = "1.90"
publish = false

[[bin]]
name = "encoding-parity"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "=0.8.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
windows-version = "0.1.7"
[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
]

[workspace]
